name: PlatformIO Build

# Compiles each project's primary PlatformIO environment on every push/PR so a
# non-building change is caught before merge. See
# docs/SYSTEM_DEVELOPMENT_WORKFLOW.md for the branch/PR workflow this supports.
#
# This intentionally builds each project's maintained environment set.
# For STM32 issue #101, both maintained profiles are required checks and the
# workflow enforces complete-image flash budgets from linked artifacts.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root (ESP32-C6 display_board)
            working-directory: .
            env: display_board
            allow-failure: false
          - name: crowpanel-43-bringup (ESP32-S3 crowpanel43)
            working-directory: crowpanel-43-bringup
            env: crowpanel43
            allow-failure: false
          - name: stm32-bluepill-bringup (bluepill_f103c8)
            working-directory: stm32-bluepill-bringup
            env: bluepill_f103c8
            flash-limit-bytes: 52428
            # Fixed in issue #3 (HardwareSerial -> Uart); now a required check.
            allow-failure: false
          - name: stm32-bluepill-bringup (bluepill_f103c8_bench)
            working-directory: stm32-bluepill-bringup
            env: bluepill_f103c8_bench
            flash-limit-bytes: 65536
            allow-failure: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ matrix.working-directory }}-${{ hashFiles(format('{0}/platformio.ini', matrix.working-directory)) }}
          restore-keys: |
            pio-${{ matrix.working-directory }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build ${{ matrix.env }}
        working-directory: ${{ matrix.working-directory }}
        continue-on-error: ${{ matrix.allow-failure }}
        run: |
          set -o pipefail
          mkdir -p ci-artifacts
          pio run -e ${{ matrix.env }} 2>&1 | tee ci-artifacts/build-${{ matrix.env }}.log

      - name: Enforce STM32 image and RAM budgets (${{ matrix.env }})
        if: ${{ matrix.working-directory == 'stm32-bluepill-bringup' }}
        working-directory: ${{ matrix.working-directory }}
        run: |
          python tools/check_stm32_size_budget.py \
            --env ${{ matrix.env }} \
            --build-dir .pio/build/${{ matrix.env }} \
            --build-log ci-artifacts/build-${{ matrix.env }}.log \
            --flash-capacity-bytes 65536 \
            --flash-limit-bytes ${{ matrix.flash-limit-bytes }} \
            --report-text ci-artifacts/size-report-${{ matrix.env }}.txt \
            --report-json ci-artifacts/size-report-${{ matrix.env }}.json

      - name: Upload STM32 size evidence (${{ matrix.env }})
        if: ${{ always() && matrix.working-directory == 'stm32-bluepill-bringup' }}
        uses: actions/upload-artifact@v4
        with:
          name: stm32-size-evidence-${{ matrix.env }}
          path: |
            ${{ matrix.working-directory }}/ci-artifacts/build-${{ matrix.env }}.log
            ${{ matrix.working-directory }}/ci-artifacts/size-report-${{ matrix.env }}.txt
            ${{ matrix.working-directory }}/ci-artifacts/size-report-${{ matrix.env }}.json
            ${{ matrix.working-directory }}/.pio/build/${{ matrix.env }}/firmware.bin
            ${{ matrix.working-directory }}/.pio/build/${{ matrix.env }}/firmware.elf
            ${{ matrix.working-directory }}/.pio/build/${{ matrix.env }}/firmware.map
          if-no-files-found: error
          retention-days: 14
