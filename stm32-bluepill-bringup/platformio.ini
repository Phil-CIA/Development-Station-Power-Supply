[platformio]
default_envs = bluepill_f103c8

[stm32_common]
; Pinned: 19.7.0 ships core 2.12 (concrete HardwareSerial); newer platforms ship core 3.x (Uart).
platform = ststm32@19.7.0
board = bluepill_f103c8
framework = arduino
monitor_speed = 115200
upload_protocol = stlink

lib_deps =
  adafruit/Adafruit AW9523@1.0.5
  adafruit/Adafruit BusIO@1.17.4

[env:bluepill_f103c8]
platform = ${stm32_common.platform}
board = ${stm32_common.board}
framework = ${stm32_common.framework}
monitor_speed = ${stm32_common.monitor_speed}
upload_protocol = ${stm32_common.upload_protocol}
lib_deps = ${stm32_common.lib_deps}
build_flags =
  -DSTM32_ENABLE_BRINGUP_BENCH_COMMANDS=0

[env:bluepill_f103c8_bench]
platform = ${stm32_common.platform}
board = ${stm32_common.board}
framework = ${stm32_common.framework}
monitor_speed = ${stm32_common.monitor_speed}
upload_protocol = ${stm32_common.upload_protocol}
lib_deps = ${stm32_common.lib_deps}
build_flags =
  -DSTM32_ENABLE_BRINGUP_BENCH_COMMANDS=1
